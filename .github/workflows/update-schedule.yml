name: Update Izzy's class schedule
on:
  schedule:
    - cron: "15 10 * * *"   # every day at 5:15 AM Eastern (10:15 UTC; 6:15 AM during daylight time)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-schedule.mjs
      - name: Commit if the schedule changed
        run: |
          if git diff --quiet -- izzy-schedule.json; then echo "No changes"; exit 0; fi
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add izzy-schedule.json
          git commit -m "Update class schedule from Best Fitness"
          git push
