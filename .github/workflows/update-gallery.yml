name: Update gallery from iCloud album
on:
  schedule:
    - cron: "45 10 * * *"   # daily, about 5:45 AM Eastern
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp@0.33.5
      - run: node scripts/update-gallery.mjs
        env:
          ICLOUD_ALBUM_TOKEN: ${{ secrets.ICLOUD_ALBUM_TOKEN }}
      - name: Commit new photos
        run: |
          if [ -n "$(git status --porcelain gallery gallery.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A gallery gallery.json
            git commit -m "Sync gallery with the iCloud album"
            git push
          fi
